<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" role="img">
  <!-- pdf-press starter figure. Conventions (enforced by lint.py):
       viewBox width = theme.contentWidth · rx=4 on boxes · stroke-width 1.2
       font-size only 11 (group title) / 9.5 (body label) / 8 (annotation)
       every colour from theme.colors or theme.signals
       every language-specific string as a {{t:key}} token in labels.json -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6770"/>
    </marker>
    <marker id="arr-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0e7a45"/>
    </marker>
  </defs>

  <!-- left: the actor -->
  <rect x="0" y="78" width="150" height="66" rx="4" fill="#f5f6f7" stroke="#c4ccd2" stroke-width="1.2"/>
  <text x="14" y="102" font-size="11" fill="#101418">{{t:fig1.actor}}</text>
  <text x="14" y="120" font-size="8" fill="#5b6770">{{t:fig1.actor.sub}}</text>

  <!-- centre: the system under description -->
  <rect x="210" y="16" width="340" height="204" rx="4" fill="#ffffff" stroke="#c4ccd2" stroke-width="1.2"/>
  <text x="226" y="40" font-size="11" fill="#101418">{{t:fig1.system}}</text>

  <rect x="226" y="56" width="308" height="42" rx="4" fill="#f5f6f7" stroke="#dde2e6" stroke-width="1.2"/>
  <text x="240" y="82" font-size="9.5" fill="#1f2429">{{t:fig1.mod1}}</text>

  <rect x="226" y="108" width="308" height="42" rx="4" fill="#e6effa" stroke="#1f66ad" stroke-width="1.2"/>
  <text x="240" y="134" font-size="9.5" fill="#1f2429">{{t:fig1.mod2}}</text>

  <rect x="226" y="160" width="308" height="42" rx="4" fill="#f5f6f7" stroke="#dde2e6" stroke-width="1.2"/>
  <text x="240" y="186" font-size="9.5" fill="#1f2429">{{t:fig1.mod3}}</text>

  <!-- right: the external counterparty -->
  <rect x="610" y="78" width="150" height="66" rx="4" fill="#e5f4ea" stroke="#0e7a45" stroke-width="1.2"/>
  <text x="624" y="102" font-size="11" fill="#101418">{{t:fig1.external}}</text>
  <text x="624" y="120" font-size="8" fill="#5b6770">{{t:fig1.external.sub}}</text>

  <!-- edges: solid = request/response, dashed = async/eventing -->
  <line x1="150" y1="111" x2="204" y2="111" stroke="#5b6770" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="152" y="104" font-size="8" fill="#5b6770">{{t:fig1.edge.in}}</text>

  <line x1="556" y1="111" x2="604" y2="111" stroke="#0e7a45" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr-live)"/>
  <text x="558" y="104" font-size="8" fill="#0e7a45">{{t:fig1.edge.out}}</text>
</svg>
