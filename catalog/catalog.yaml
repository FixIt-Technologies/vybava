schema_version: 1

items:
  - id: memorylint
    kind: applet
    status: stable
    description: Validate and maintain Obsidian-compatible AI memory files — schema, indexes, links, limits, fixture data, external references, and agent write hooks.
    applet: memorylint

  - id: fontfreeze
    kind: applet
    status: experimental
    description: Freeze variable webfonts at the axis positions a site renders and subset them per language, via fonttools.
    applet: fontfreeze

  - id: perfrig
    kind: applet
    status: experimental
    description: Orchestrate a performance drill from a testing/<project>/perf manifest — neighbor guard, staged push-to-first-failure ramp, and percentile-vs-concurrency report; projects supply seed/auth/generator commands.
    applet: perfrig

  - id: shrt
    kind: applet
    status: experimental
    description: Shorten URLs into terminal-safe luko.to links that never wrap or truncate on click in narrow panes; also runs the redirector server.
    applet: shrt

  - id: prm
    kind: skill
    status: experimental
    description: Monitor an existing pull request and resolve review feedback until it is ready to merge.
    source: skills/prm

  - id: prc
    kind: skill
    status: experimental
    description: Create or find the current branch pull request, then hand it to the PR monitor workflow.
    source: skills/prc

  - id: merge
    kind: skill
    status: experimental
    description: Merge a pull request only after its safety, review, and CI gates pass.
    source: skills/merge

groups:
  - id: recommended
    description: Stable baseline suitable for every workstation and project.
    items:
      - memorylint

  - id: experimental
    description: Early packages that are useful but still evolving.
    items:
      - prm
      - prc
      - merge
      - fontfreeze
      - perfrig
      - shrt

  - id: ai-git
    description: Reusable pull-request creation, review, and merge workflows.
    items:
      - prm
      - prc
      - merge

  - id: everything
    description: Every package currently published by Výbava.
    items:
      - memorylint
      - fontfreeze
      - perfrig
      - shrt
      - prm
      - prc
      - merge
