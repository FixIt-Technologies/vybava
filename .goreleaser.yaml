version: 2

project_name: vybava

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: vybava
    main: ./cmd/vybava
    binary: vybava
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: vybava
    ids:
      - vybava
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

homebrew_casks:
  - name: vybava
    ids:
      - vybava
    binaries:
      - vybava
    homepage: https://github.com/henderson-tech/vybava
    description: Portable engineering tools, agent skills, and diagnostics for every project
    license: MIT
    directory: Casks
    commit_msg_template: "chore(cask): update vybava to {{ .Tag }}"
    repository:
      owner: henderson-tech
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:henderson-tech/homebrew-tap.git
        private_key: "{{ .Env.TAP_DEPLOY_KEY }}"
    commit_author:
      name: vybava-release
      email: engineering@fixit.technology
    url:
      template: https://github.com/henderson-tech/vybava/releases/download/{{ .Tag }}/{{ .ArtifactName }}
      verified: github.com/henderson-tech/vybava/
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/vybava"]
          end
